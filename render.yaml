# Render Blueprint — coop-whatsapp
# Deploy: GitHub repo → Render Dashboard → New → Blueprint → pick this repo.
# Creates the PostgreSQL database + web service with correct build/start commands.
#
# This blueprint defines TWO environments:
# - PRODUCTION: deploys from `main` branch, uses production credentials
# - STAGING: deploys from `staging` branch, uses separate database and test credentials
#
# Promotion flow: PR to `staging` → auto-deploys to staging → manual approval → merge to `main` → auto-deploys to production

databases:
  - name: coop-db
    databaseName: coop
    plan: basic-256mb # cheapest persistent Postgres; upgrade later if needed

  - name: coop-db-staging
    databaseName: coop_staging
    plan: basic-256mb # separate staging database

services:
  - type: redis
    name: coop-redis
    plan: starter # 256MB, persistent; needed for session caching and token blacklisting
    ipAllowList: [] # only accessible from Render private network

  - type: redis
    name: coop-redis-staging
    plan: starter # separate staging Redis
    ipAllowList: []

  - type: web
    name: coop-bot-staging
    runtime: node
    plan: starter # free plan SLEEPS after 15 min idle — breaks WhatsApp bot; starter stays on
    region: frankfurt # closest region to Nigeria on Render (also: oregon, ohio, singapore)
    branch: staging # deploys from staging branch
    buildCommand: npm ci && npx prisma generate && npm run build
    # Runs once per deploy, before the new version receives traffic. Applies
    # pending Prisma migrations with safe baselining against the db-push-era
    # production database (see scripts/db-migrate.mjs). Runs on the native Node
    # runtime — the Dockerfile is kept only for local/self-hosted use.
    preDeployCommand: node scripts/db-migrate.mjs
    startCommand: npm start
    healthCheckPath: /health
    # Deploys are GATED ON CI: this service does not auto-deploy on push.
    # The `staging-deploy-gate` job in .github/workflows/ci.yml POSTs the Render
    # Deploy Hook (secret RENDER_DEPLOY_HOOK_STAGING) only after typecheck, lint,
    # tests, security tests, migrations and build all pass.
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coop-db-staging
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: coop-redis-staging
          property: connectionString
      - key: NODE_ENV
        value: staging
      # ---- Set these in the Render dashboard after first deploy ----
      # Use TEST/SANDBOX credentials for staging environment
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: MONNIFY_API_KEY
        sync: false
      - key: MONNIFY_SECRET_KEY
        sync: false
      - key: MONNIFY_CONTRACT_CODE
        sync: false
      - key: MONNIFY_BASE_URL
        value: https://sandbox.monnify.com
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: TWO_FA_REQUIRED
        value: "1"
      - key: NEW_BENEFICIARY_HOLD_HOURS
        value: "24"
      - key: REPIN_THRESHOLD_NGN
        value: "50000"
      - key: PILOT_FLOAT_CAP
        sync: false
      - key: DIGEST_HOUR
        value: "20"
      - key: PAYMENT_PROVIDER
        value: monnify
      - key: TRANSFER_POLL_MINUTES
        value: "10"
      - key: BACKUP_DIR
        value: "/app/backups"
      - key: DASHBOARD_ORIGIN
        sync: false
      # ---- Backup storage (S3 recommended — local disk is EPHEMERAL on Render) ----
      - key: BACKUP_BUCKET
        sync: false
      - key: BACKUP_KEY
        sync: false
      - key: BACKUP_SECRET
        sync: false
      - key: BACKUP_ENDPOINT
        sync: false
      - key: BACKUP_REGION
        value: "eu-west-1"
      # ---- Platform Console bootstrap (optional) ----
      # Seeds the first platform owner on boot; leave unset to skip.
      - key: PLATFORM_OWNER_PHONE
        sync: false
      - key: PLATFORM_OWNER_NAME
        sync: false

  - type: web
    name: coop-bot
    runtime: node
    plan: starter # free plan SLEEPS after 15 min idle — breaks WhatsApp bot; starter stays on
    region: frankfurt # closest region to Nigeria on Render (also: oregon, ohio, singapore)
    branch: main
    buildCommand: npm ci && npx prisma generate && npm run build
    # Runs once per deploy, before the new version receives traffic. Applies
    # pending Prisma migrations with safe baselining against the db-push-era
    # production database (see scripts/db-migrate.mjs). Runs on the native Node
    # runtime — the Dockerfile is kept only for local/self-hosted use.
    preDeployCommand: node scripts/db-migrate.mjs
    startCommand: npm start
    healthCheckPath: /health
    # Deploys are GATED ON CI: production does not auto-deploy on push.
    # The `production-deploy-gate` job in .github/workflows/ci.yml POSTs the
    # Render Deploy Hook (secret RENDER_DEPLOY_HOOK_PRODUCTION) only after all
    # checks pass. See the staging service above for the full rationale.
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coop-db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: coop-redis
          property: connectionString
      - key: NODE_ENV
        value: production
      # ---- Set these in the Render dashboard after first deploy ----
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: MONNIFY_API_KEY
        sync: false
      - key: MONNIFY_SECRET_KEY
        sync: false
      - key: MONNIFY_CONTRACT_CODE
        sync: false
      - key: MONNIFY_BASE_URL
        # PRODUCTION Monnify API. Do NOT use sandbox for live movement of money;
        # the app refuses to start with the sandbox URL when NODE_ENV=production.
        value: https://api.monnify.com
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: TWO_FA_REQUIRED
        value: "1"
      - key: NEW_BENEFICIARY_HOLD_HOURS
        value: "24"
      - key: REPIN_THRESHOLD_NGN
        value: "50000"
      - key: PILOT_FLOAT_CAP
        sync: false
      - key: DIGEST_HOUR
        value: "20"
      - key: PAYMENT_PROVIDER
        value: monnify # primary provider is Monnify (prod API); Paystack is fallback
      - key: TRANSFER_POLL_MINUTES
        value: "10"
      - key: BACKUP_DIR
        value: "/app/backups" # local backup directory (use S3 for persistence on Render)
      - key: DASHBOARD_ORIGIN
        sync: false # set to your dashboard URL, e.g. https://admin.yourdomain.com
      # ---- Backup storage (S3 recommended — local disk is EPHEMERAL on Render) ----
      # Backups on Render's ephemeral disk are lost on redeploy/sleep.
      # Set these to use an S3-compatible bucket for persistent backups.
      - key: BACKUP_BUCKET
        sync: false # optional: S3 bucket name (e.g. "coop-backups-prod")
      - key: BACKUP_KEY
        sync: false # optional: S3 access key
      - key: BACKUP_SECRET
        sync: false # optional: S3 secret key
      - key: BACKUP_ENDPOINT
        sync: false # optional: S3 endpoint for non-AWS providers (e.g. Cloudflare R2)
      - key: BACKUP_REGION
        value: "eu-west-1" # default region; override for non-AWS S3
      # ---- Platform Console bootstrap (optional) ----
      # Seeds the first platform owner on boot; leave unset to skip.
      - key: PLATFORM_OWNER_PHONE
        sync: false
      - key: PLATFORM_OWNER_NAME
        sync: false
