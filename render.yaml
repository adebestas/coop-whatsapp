# Render Blueprint — coop-whatsapp
# Deploy: GitHub repo → Render Dashboard → New → Blueprint → pick this repo.
# Creates the PostgreSQL database + web service with correct build/start commands.

databases:
  - name: coop-db
    databaseName: coop
    plan: basic-256mb   # cheapest persistent Postgres; upgrade later if needed

services:
  - type: redis
    name: coop-redis
    plan: starter        # 256MB, persistent; needed for session caching and token blacklisting
    ipAllowList: []      # only accessible from Render private network

  - type: web
    name: coop-bot
    runtime: node
    plan: starter        # free plan SLEEPS after 15 min idle — breaks WhatsApp bot; starter stays on
    region: oregon        # closest to Nigeria on Render (also: frankfurt, ohio, singapore)
    branch: main
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy   # run migrations before every deploy
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true     # every push to main deploys automatically
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coop-db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: coop-redis
          property: connectionString
      - key: NODE_ENV
        value: production
      # ---- Set these in the Render dashboard after first deploy ----
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: MONNIFY_API_KEY
        sync: false
      - key: MONNIFY_SECRET_KEY
        sync: false
      - key: MONNIFY_CONTRACT_CODE
        sync: false
      - key: MONNIFY_BASE_URL
        value: https://sandbox.monnify.com
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: TWO_FA_REQUIRED
        value: "1"
      - key: NEW_BENEFICIARY_HOLD_HOURS
        value: "24"
      - key: REPIN_THRESHOLD_NGN
        value: "50000"
      - key: PILOT_FLOAT_CAP
        sync: false
      - key: DIGEST_HOUR
        value: "20"
      - key: PAYMENT_PROVIDER
        sync: false          # set to paystack if not using monnify as primary
      - key: TRANSFER_POLL_MINUTES
        value: "10"
      - key: BACKUP_DIR
        value: "/app/backups" # local backup directory (use S3 for persistence on Render)
      - key: DASHBOARD_ORIGIN
        sync: false          # set to your dashboard URL, e.g. https://admin.yourdomain.com
      # ---- Backup storage (S3 recommended — local disk is EPHEMERAL on Render) ----
      # Backups on Render's ephemeral disk are lost on redeploy/sleep.
      # Set these to use an S3-compatible bucket for persistent backups.
      - key: BACKUP_BUCKET
        sync: false          # optional: S3 bucket name (e.g. "coop-backups-prod")
      - key: BACKUP_KEY
        sync: false          # optional: S3 access key
      - key: BACKUP_SECRET
        sync: false          # optional: S3 secret key
      - key: BACKUP_ENDPOINT
        sync: false          # optional: S3 endpoint for non-AWS providers (e.g. Cloudflare R2)
      - key: BACKUP_REGION
        value: "eu-west-1"   # default region; override for non-AWS S3
