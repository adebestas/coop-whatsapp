<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platform Console — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="dev.css">
</head>
<body class="login-page dev-login-page">
  <div class="login-container dev-login-container">
    <div class="login-card dev-login-card">
      <div class="login-logo">
        <div class="logo-mark">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <rect width="48" height="48" rx="12" fill="#4F46E5"/>
            <path d="M24 12l10 4v7c0 6-4.2 10.6-10 13-5.8-2.4-10-7-10-13v-7l10-4z" fill="none" stroke="white" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M20 24l3 3 5-6" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1>Platform Console</h1>
        <p class="login-subtitle">Coop Platform Operator Access</p>
      </div>

      <form id="loginForm" class="login-form" novalidate>
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <div class="input-wrapper">
            <span class="input-prefix">+234</span>
            <input type="tel" id="phone" name="phone" placeholder="801 234 5678" required autocomplete="tel" inputmode="numeric">
          </div>
        </div>

        <div class="form-group">
          <label for="pin">PIN</label>
          <input type="password" id="pin" name="pin" placeholder="PIN" required minlength="4" maxlength="6" pattern="[0-9]{4,6}" autocomplete="current-password" inputmode="numeric">
        </div>

        <div class="form-group" id="totpGroup" hidden>
          <label for="totp">Authenticator code</label>
          <input type="text" id="totp" name="totp" placeholder="6-digit code" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
        </div>

        <button type="button" id="toggle2fa" class="dev-toggle-2fa">Use a 2FA code</button>

        <div id="loginError" class="form-error" hidden></div>

        <button type="submit" id="loginBtn" class="btn btn-primary btn-full">
          <span class="btn-text">Sign In</span>
          <span class="btn-loader" hidden>
            <svg class="spinner" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="31.4 31.4" stroke-linecap="round"/></svg>
          </span>
        </button>
      </form>

      <form id="changePinForm" class="login-form" hidden>
        <div class="form-group">
          <label for="newPin">Set a new 6-digit PIN</label>
          <input type="password" id="newPin" name="newPin" placeholder="6-digit PIN" required minlength="6" maxlength="6" pattern="[0-9]{6}" autocomplete="new-password" inputmode="numeric">
          <p class="dev-hint">Your temporary PIN must be changed before you can continue.</p>
        </div>
        <div id="changePinError" class="form-error" hidden></div>
        <button type="submit" id="changePinBtn" class="btn btn-primary btn-full">
          <span class="btn-text">Set PIN &amp; Continue</span>
          <span class="btn-loader" hidden>
            <svg class="spinner" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="31.4 31.4" stroke-linecap="round"/></svg>
          </span>
        </button>
      </form>

      <p class="login-footer">Authorised platform operators only. Activity is audited.</p>
    </div>

    <div class="login-decoration">
      <div class="deco-pattern"></div>
    </div>
  </div>

  <script src="dev-login.js"></script>
</body>
</html>
