# CI Pipeline — Coop WhatsApp
# Runs on every push to staging/main and on PRs to those branches.
# Gates: typecheck, lint, format, unit tests, security tests.
# Staging deploy only proceeds if all checks pass.

name: CI

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

env:
  NODE_VERSION: "22"

jobs:
  # ---------- Type-check & Lint ----------
  typecheck-and-lint:
    name: Type-check & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

  # ---------- Unit Tests ----------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client (SQLite, matches `npm test`)
        run: npm run prisma:generate:local

      - name: Create SQLite test schema
        run: npx prisma db push --schema prisma/schema.local.prisma --skip-generate
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Run unit tests
        run: npm test
        env:
          # Tests run on SQLite via prisma/schema.local.prisma (see vitest.config.ts)
          DATABASE_URL: "file:./dev.db"
          # The app loads these from .env locally; on CI they must be supplied.
          # Non-placeholder values so the startup weak-secret checks stay quiet.
          ADMIN_JWT_SECRET: "ci-unit-test-admin-jwt-0123456789abcdef"
          SESSION_SECRET: "ci-unit-test-session-secret-0123456789abcdef"

  # ---------- Security Tests ----------
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client (SQLite)
        run: npm run prisma:generate:local

      - name: Create SQLite test schema
        run: npx prisma db push --schema prisma/schema.local.prisma --skip-generate
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Run security tests only
        run: npx vitest run tests/security.test.ts
        env:
          DATABASE_URL: "file:./dev.db"

  # ---------- PostgreSQL migrations ----------
  # Proves the production migration path on a real PostgreSQL: scripts/db-migrate.mjs
  # must bring a fresh database to the current schema. The RLS isolation suite then
  # runs as a NON-OWNER role (the owner bypasses RLS), so the policies are actually
  # exercised — see tests/rls-isolation.test.ts.
  postgres-migrations:
    name: PostgreSQL migrations + RLS isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: coop_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d coop_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client (PostgreSQL)
        run: npm run prisma:generate

      - name: Apply migrations via the production boot script
        run: node scripts/db-migrate.mjs
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/coop_test

      - name: Boot script is idempotent
        run: node scripts/db-migrate.mjs
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/coop_test

      - name: Run RLS isolation tests (non-owner role, PostgreSQL)
        run: npx vitest run tests/rls-isolation.test.ts
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/coop_test
          RLS_ENABLED: "1"

  # ---------- Dependency Audit ----------
  # Fails on a HIGH/CRITICAL vulnerability in a SHIPPED (production) dependency.
  # Dev-only advisories (test tooling) do not block shipping.
  dependency-audit:
    name: Dependency Audit (prod)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # ---------- Build Verification ----------
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [typecheck-and-lint, unit-tests, security-tests, postgres-migrations, dependency-audit]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build

  # ---------- Staging Deploy Gate ----------
  # Runs only on the `staging` branch (not PRs), and only after every check job
  # above has succeeded. Render's auto-deploy is OFF (see render.yaml), so this
  # job is what actually ships: it POSTs the Render Deploy Hook.
  staging-deploy-gate:
    name: Staging Deploy Gate
    runs-on: ubuntu-latest
    needs:
      [typecheck-and-lint, unit-tests, security-tests, postgres-migrations, dependency-audit, build]
    if: github.ref == 'refs/heads/staging'
    steps:
      - name: Trigger staging deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_STAGING is not configured — skipping deploy trigger."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          echo "Staging deploy triggered."

  # ---------- Production Deploy Gate ----------
  # Runs only on the `main` branch (not PRs), after all checks pass. Render's
  # auto-deploy is OFF (see render.yaml); this job triggers the deploy itself.
  production-deploy-gate:
    name: Production Deploy Gate
    runs-on: ubuntu-latest
    needs:
      [typecheck-and-lint, unit-tests, security-tests, postgres-migrations, dependency-audit, build]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger production deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PRODUCTION }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_PRODUCTION is not configured — skipping deploy trigger."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          echo "Production deploy triggered."
